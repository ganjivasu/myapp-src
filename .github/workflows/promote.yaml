
name: Promote Image (PR-based)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - pt
          - qa
          - prod
      image:
        description: Full ECR image URI with immutable SHA256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ganjivasu/myapp-gitops
          token: ${{ secrets.GITHUBTOKEN }}
          ref: main
          persist-credentials: false

      - name: Install yq
        run: |
          YQ_VERSION=v4.45.1
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Validate promotion input
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if [[ ! "$IMAGE" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/myapp@sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid ECR image digest"
            exit 1
          fi

      - name: Update GitOps manifests
        id: update
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          GH_TOKEN: ${{ secrets.GITHUBTOKEN }}
        run: |
          set -euo pipefail

          BRANCH="promote-myapp-${ENVIRONMENT}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          chmod +x scripts/promotion.sh
          scripts/promotion.sh "$ENVIRONMENT" "$IMAGE"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes detected"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "Promote myapp to ${ENVIRONMENT}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create promotion pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUBTOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          gh pr create \
            --repo ganjivasu/myapp-gitops \
            --title "Promote myapp to ${ENVIRONMENT}" \
            --body "Promoting immutable image ${IMAGE} to ${ENVIRONMENT}" \
            --base main \
            --head "$BRANCH"
